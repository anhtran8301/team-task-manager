name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
        env:
          MYSQL_DATABASE: team_tasks
          MYSQL_USER: team_tasks
          MYSQL_PASSWORD: local-password
          MYSQL_ROOT_PASSWORD: local-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fe/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, dom, xml, curl
          tools: composer:v2
          coverage: none
      - name: Install and seed native applications
        run: |
          MYSQL_PWD=local-root-password mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE team_tasks_test; GRANT ALL ON team_tasks_test.* TO team_tasks;"
          sh scripts/setup.sh
      - name: Static checks and unit/feature tests
        run: sh scripts/check.sh
      - name: Start native servers
        run: |
          php be/artisan serve --host=127.0.0.1 --port=8000 > /tmp/backend.log 2>&1 &
          npm --prefix fe run dev -- --host 127.0.0.1 > /tmp/frontend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/up && curl -fsS http://localhost:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Browser acceptance tests
        working-directory: fe
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            fe/playwright-report
            fe/test-results
            /tmp/backend.log
            /tmp/frontend.log
